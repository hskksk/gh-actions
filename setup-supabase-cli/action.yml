name: Setup Supabase CLI
description: Verify Supabase CI secrets and install the Supabase CLI
branding:
  icon: database
  color: green

inputs:
  cli-version:
    description: Reserved for future pin; currently uses supabase/setup-cli@v2 default
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Require Supabase secrets
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
        SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
        SUPABASE_DB_PASSWORD: ${{ env.SUPABASE_DB_PASSWORD }}
      run: |
        set -euo pipefail
        missing=()
        [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing+=(SUPABASE_ACCESS_TOKEN)
        [ -z "${SUPABASE_PROJECT_REF:-}" ] && missing+=(SUPABASE_PROJECT_REF)
        [ -z "${SUPABASE_DB_PASSWORD:-}" ] && missing+=(SUPABASE_DB_PASSWORD)
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::Missing required secrets for Supabase: ${missing[*]}"
          echo "Add them in GitHub → Settings → Secrets and variables → Actions."
          exit 1
        fi

    - name: Install Supabase CLI
      uses: supabase/setup-cli@v2
