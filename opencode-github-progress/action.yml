name: Stage OpenCode GitHub progress script
description: Optional — install opencode-github-progress.sh outside the checkout for gh-based phase comments (not used by the default opencode reusable workflow; prefer prompt-only progress in opencode.yml)
branding:
  icon: message-square
  color: blue

runs:
  using: composite
  steps:
    - name: Install progress helper outside checkout
      shell: bash
      run: |
        set -euo pipefail
        dest="/tmp/opencode-github-progress.sh"
        install -m 755 "${{ github.action_path }}/opencode-github-progress.sh" "$dest"

        # Bundled opencode.json lives in this action directory (not the consumer checkout).
        {
          echo "OPENCODE_GITHUB_PROGRESS_SCRIPT=$dest"
          echo "OPENCODE_CONFIG_DIR=${{ github.action_path }}"
        } >>"$GITHUB_ENV"
