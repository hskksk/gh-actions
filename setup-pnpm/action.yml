name: Setup pnpm
description: Install pnpm and Node.js, with optional pnpm install
branding:
  icon: package
  color: blue

inputs:
  pnpm-version:
    description: pnpm version for pnpm/action-setup
    required: true
  node-version:
    description: Node.js version for actions/setup-node
    required: true
  cache:
    description: Enable pnpm cache in setup-node
    required: false
    default: "true"
  install:
    description: Run pnpm install after setup
    required: false
    default: "false"
  frozen-lockfile:
    description: When install is true, pass --frozen-lockfile
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js (with pnpm cache)
      if: inputs.cache == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Setup Node.js (no cache)
      if: inputs.cache != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: |
        if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
          pnpm install --frozen-lockfile
        else
          pnpm install
        fi
