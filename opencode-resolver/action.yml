name: OpenCode resolver
description: Parse OpenCode slash commands, check authorization, and output mode, model, and prompt
branding:
  icon: terminal
  color: orange

inputs:
  github-token:
    description: GitHub token for collaborator permission checks
    required: false
    default: ${{ github.token }}
  trigger-allowlist:
    description: Comma- or newline-separated GitHub logins (optional @ prefix)
    required: false
    default: ""
  default-model:
    description: Model when none is specified
    required: false
    default: opencode/big-pickle
  post-model-ack:
    description: Post a short acknowledgment comment when a catalog model is specified
    required: false
    default: "true"
  oidc-base-url:
    description: OpenCode OIDC exchange API base URL (default https://api.opencode.ai)
    required: false
    default: "https://api.opencode.ai"

outputs:
  mode:
    description: skip, reply, or build
  model:
    description: Resolved model id
  prompt:
    description: Trigger text for OpenCode (model tokens stripped from the command line when present)
  instruction:
    description: User instruction text after the slash command (for acknowledgment)
  model-explicit:
    description: true when the user specified a model from the OpenCode catalog

runs:
  using: node20
  main: dist/index.js
