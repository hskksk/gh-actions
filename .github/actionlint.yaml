# actionlint 1.7.12 does not yet support GitHub's $/ self-repository uses: syntax
# (https://github.com/rhysd/actionlint/issues/711). Remove when upgrading past the fix in PR #732.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'specifying action "\$/.+" in invalid format because ref is missing'
  workflows/**/*.{yml,yaml}:
    ignore:
      - 'specifying action "\$/.+" in invalid format because ref is missing'
