# Reusable OpenCode job (slash commands, toolchain, anomalyco/opencode/github).
# Also dogfoods in this repo via issue/PR triggers below (same events as examples/opencode-consumer.yml).
# Other repos: thin wrapper with `workflow_call` — see examples/opencode-consumer.yml.
# Toolchain versions come from the caller's `.mise.toml` (setup-mise).
#
# /oc build: OpenCode posts phase comments via scripts/opencode-github-progress.sh
# (開始・調査・下書きPR・実装・検証・提出). Draft PR early so another run can continue.
name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]
  workflow_call:
    inputs:
      toolchain:
        description: pnpm or bun for build mode
        type: string
        default: pnpm
      pnpm-version:
        description: Deprecated; pin pnpm in the caller `.mise.toml` instead
        type: string
        default: "9.14.0"
      node-version:
        description: Deprecated; pin node in the caller `.mise.toml` instead
        type: string
        default: "24"
      bun-version:
        description: Deprecated; pin bun in the caller `.mise.toml` instead
        type: string
        default: "1.3.0"
      stub-opencode-auth:
        description: Create empty opencode auth.json before build (eval/tests)
        type: boolean
        default: false
      trigger-allowlist:
        description: Value for OPENCODE_TRIGGER_ALLOWLIST (comma-separated logins)
        type: string
        default: ""
      prompt:
        description: Optional extra instructions from the consumer workflow (merged into OpenCode PROMPT)
        type: string
        default: ""
    secrets:
      OPENCODE_API_KEY:
        required: false
      OPENCODE_GO_API_KEY:
        required: false

env:
  # gh-actions preset (layer 3) — merged into anomalyco/opencode/github `prompt` → PROMPT env
  OPENCODE_GH_ACTIONS_PRESET: |
    You run inside a **GitHub Actions** job (`CI=true`, non-interactive). Do not ask questions; permission prompts are denied.

    - Work in the checked-out repository. Use `/tmp` only for ephemeral scratch files.
    - Dependencies are installed by the workflow before OpenCode starts; prefer repo scripts over ad-hoc probes.
    - Git author identity is already configured. Reuse it for commits; do not invent noreply emails.
    - After you finish, OpenCode infrastructure handles **git push and PR creation** automatically. Do not warn about tokens or tell the user to open PRs manually.
    - If the user instruction is empty or only `/oc`, summarize the thread or review the linked issue/PR and act on what is asked in context.
    - The job **times out after 30 minutes**. Avoid finishing with no branch and no PR when the task needs repo changes.
    - Skills often say “verify, then open a PR”; **in this job, open or update a draft PR first**, then verify if time remains.

    ## PR and handoff (when the task changes the repo)

    Another `/oc` run may continue on the same branch/PR. Prefer incremental, visible progress.

    1. **Branch early** — After scope is clear (`調査`), branch off `origin/main` or continue the trigger PR branch.
    2. **Draft PR without waiting for full verification** — Commit, push, and open or update a **draft PR** as soon as there is meaningful WIP.
    3. **Keep pushing** — After substantial edits, commit and push again; note WIP gaps in the PR body.
    4. **Verify after, if time remains** — Run relevant checks after the draft exists; leave notes on the PR if checks are slow.
    5. **When time is low** — Push current commits, post `提出` on the trigger thread with the PR link, and say what a follow-up should do.

    Use `gh pr create --draft` unless the user asked for ready-for-review.

    ## Progress on the triggering thread

    Post brief status on the **same issue or PR** that started this run. The workflow staged `scripts/opencode-github-progress.sh`; use `GH_TOKEN` from this OpenCode run (GitHub App via OIDC):

    ```bash
    scripts/opencode-github-progress.sh <phase> <one or two short sentences>
    ```

    Comment **once after each** phase completes (skip only if it truly did not apply):

    | Phase | When |
    | --- | --- |
    | `開始` | Right after you understand the request (before heavy edits) |
    | `調査` | Scope and approach are clear |
    | `下書きPR` | First draft PR is opened or updated with WIP |
    | `実装` | Main edits for this pass are done (push again if you changed files after `下書きPR`) |
    | `検証` | Relevant checks ran when time allowed (optional if draft exists and time ran out) |
    | `提出` | Final push; PR link; or explain why you are stopping without a PR |

    Keep each comment to 1–3 lines; link the PR in `提出` only.

jobs:
  opencode:
    if: |
      !contains(fromJSON('["cursor[bot]","github-actions[bot]","opencode-agent[bot]"]'), github.actor) &&
      (
        (
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc-deep') || contains(github.event.comment.body, '/oc-gpt'))
        ) ||
        (
          github.event_name == 'issues' &&
          !github.event.issue.pull_request &&
          (contains(github.event.issue.body || '', '/oc') || contains(github.event.issue.body || '', '/opencode') || contains(github.event.issue.body || '', '/oc-deep') || contains(github.event.issue.body || '', '/oc-gpt'))
        ) ||
        (
          github.event_name == 'pull_request' &&
          (contains(github.event.pull_request.body || '', '/oc') || contains(github.event.pull_request.body || '', '/opencode') || contains(github.event.pull_request.body || '', '/oc-deep') || contains(github.event.pull_request.body || '', '/oc-gpt'))
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # OIDC → OpenCode GitHub App (resolver ack, anomalyco/opencode/github, progress script GH_TOKEN).
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Parse OpenCode slash command
        id: slash
        uses: $/opencode-resolver
        with:
          trigger-allowlist: ${{ inputs.trigger-allowlist || vars.OPENCODE_TRIGGER_ALLOWLIST }}

      - name: Prepare toolchain (mise)
        if: steps.slash.outputs.mode == 'build'
        uses: $/setup-mise

      - name: Install dependencies (pnpm)
        if: steps.slash.outputs.mode == 'build' && inputs.toolchain == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (bun)
        if: steps.slash.outputs.mode == 'build' && inputs.toolchain == 'bun'
        run: bun install --frozen-lockfile

      - name: Stub opencode auth for eval unit tests
        if: steps.slash.outputs.mode == 'build' && inputs.stub-opencode-auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{}' > ~/.local/share/opencode/auth.json

      - name: Stage OpenCode progress helper
        if: steps.slash.outputs.mode == 'build'
        uses: $/opencode-github-progress

      - name: Run opencode (github-reply)
        if: steps.slash.outputs.mode == 'reply'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          model: ${{ steps.slash.outputs.model }}
          agent: github-reply
          prompt: ${{ steps.slash.outputs.prompt }}

      - name: Run opencode
        if: steps.slash.outputs.mode == 'build'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          # → MODEL env inside action (opencode github run)
          model: ${{ steps.slash.outputs.model }}
          share: true
          # → PROMPT env: preset (workflow env) + consumer input + slash trigger text
          prompt: |
            ${{ env.OPENCODE_GH_ACTIONS_PRESET }}

            ${{ inputs.prompt }}

            ${{ steps.slash.outputs.prompt }}
