# Reusable OpenCode job (slash commands, toolchain, anomalyco/opencode/github).
# Caller keeps `on:` triggers; pass vars via inputs (e.g. trigger-allowlist from vars).
# Toolchain versions come from the caller's `.mise.toml` (setup-mise).
name: OpenCode

on:
  workflow_call:
    inputs:
      toolchain:
        description: pnpm or bun for build mode
        type: string
        default: pnpm
      pnpm-version:
        description: Deprecated; pin pnpm in the caller `.mise.toml` instead
        type: string
        default: "9.14.0"
      node-version:
        description: Deprecated; pin node in the caller `.mise.toml` instead
        type: string
        default: "24"
      bun-version:
        description: Deprecated; pin bun in the caller `.mise.toml` instead
        type: string
        default: "1.3.0"
      stub-opencode-auth:
        description: Create empty opencode auth.json before build (eval/tests)
        type: boolean
        default: false
      trigger-allowlist:
        description: Value for OPENCODE_TRIGGER_ALLOWLIST (comma-separated logins)
        type: string
        default: ""
      prompt:
        description: Optional extra instructions from the consumer workflow (appended before /oc task text)
        type: string
        default: ""
    secrets:
      OPENCODE_API_KEY:
        required: false
      OPENCODE_GO_API_KEY:
        required: false

jobs:
  opencode:
    if: |
      !contains(fromJSON('["cursor[bot]","github-actions[bot]","opencode-agent[bot]"]'), github.actor) &&
      (
        (
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
        ) ||
        (
          github.event_name == 'issues' &&
          !github.event.issue.pull_request &&
          (contains(github.event.issue.body || '', '/oc') || contains(github.event.issue.body || '', '/opencode'))
        ) ||
        (
          github.event_name == 'pull_request' &&
          (contains(github.event.pull_request.body || '', '/oc') || contains(github.event.pull_request.body || '', '/opencode'))
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # OIDC → OpenCode GitHub App installation token (anomalyco/opencode/github default).
    # GitHub API read/write for issues/PRs uses that token, not github.token scopes.
    permissions:
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Parse OpenCode slash command
        id: slash
        uses: ./opencode-resolver
        with:
          trigger-allowlist: ${{ inputs.trigger-allowlist }}

      - name: Prepare toolchain (mise)
        if: steps.slash.outputs.mode == 'build'
        uses: hskksk/gh-actions/setup-mise@v1

      - name: Install dependencies (pnpm)
        if: steps.slash.outputs.mode == 'build' && inputs.toolchain == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (bun)
        if: steps.slash.outputs.mode == 'build' && inputs.toolchain == 'bun'
        run: bun install --frozen-lockfile

      - name: Stub opencode auth for eval unit tests
        if: steps.slash.outputs.mode == 'build' && inputs.stub-opencode-auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{}' > ~/.local/share/opencode/auth.json

      - name: Run opencode (github-reply)
        if: steps.slash.outputs.mode == 'reply'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          model: ${{ steps.slash.outputs.model }}
          agent: github-reply
          prompt: ${{ steps.slash.outputs.prompt }}

      - name: Compose OpenCode user prompt
        if: steps.slash.outputs.mode == 'build'
        id: oc_user_prompt
        env:
          CALLER_PROMPT: ${{ inputs.prompt }}
          SLASH_PROMPT: ${{ steps.slash.outputs.prompt }}
        run: |
          preset="$(cat <<'EOF'
You run inside a **GitHub Actions** job (`CI=true`, non-interactive). Do not ask questions; permission prompts are denied.

- Work in the checked-out repository. Use `/tmp` only for ephemeral scratch files.
- Dependencies are installed by the workflow before OpenCode starts; prefer repo scripts over ad-hoc probes.
- Git author identity is already configured. Reuse it for commits; do not invent noreply emails.
- After you finish, OpenCode infrastructure handles **git push and PR creation** automatically. Do not warn about tokens or tell the user to open PRs manually.
- If the user instruction is empty or only `/oc`, summarize the thread or review the linked issue/PR and act on what is asked in context.
EOF
)"
          combined="$preset"
          if [ -n "$CALLER_PROMPT" ]; then
            combined="${combined}

          ${CALLER_PROMPT}"
          fi
          if [ -n "$SLASH_PROMPT" ]; then
            combined="${combined}

          ${SLASH_PROMPT}"
          fi
          delimiter="$(openssl rand -hex 16)"
          {
            echo "prompt<<${delimiter}"
            printf '%s\n' "$combined"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Run opencode
        if: steps.slash.outputs.mode == 'build'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          model: ${{ steps.slash.outputs.model }}
          share: true
          prompt: ${{ steps.oc_user_prompt.outputs.prompt }}
