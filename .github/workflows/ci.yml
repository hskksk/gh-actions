name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/actions/setup-mise

      - name: Lint workflows
        run: actionlint -color .github/workflows/*.yml

  opencode-resolver:
    name: opencode-resolver (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actions/opencode-resolver
    steps:
      - uses: actions/checkout@v4

      - uses: $/actions/setup-mise

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      - name: Verify dist exists
        run: test -f dist/index.js

      - name: Verify action metadata
        run: test -f action.yml

  smoke-setup-mise:
    name: setup-mise smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/actions/setup-mise

      - name: Assert pinned mise version
        run: mise --version | grep -F "2026.10.2"

      - run: node --version
      - run: pnpm --version

  smoke-setup-pnpm:
    name: setup-pnpm smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/actions/setup-pnpm
        with:
          pnpm-version: "9.14.0"
          node-version: "24"
          install: "false"
          cache: "false"

      - run: pnpm --version
      - run: node --version

  smoke-setup-supabase-cli:
    name: setup-supabase-cli (missing secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expect failure when secrets unset
        uses: $/actions/setup-supabase-cli
        continue-on-error: true
        id: supabase

      - name: Assert missing-secret guard
        run: |
          if [ "${{ steps.supabase.outcome }}" != "failure" ]; then
            echo "Expected setup-supabase-cli to fail without secrets"
            exit 1
          fi

  smoke-publish-github-pages-artifact:
    name: publish-github-pages-artifact (skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/actions/publish-github-pages-artifact
        with:
          path: .
          skip: "true"

  smoke-opencode-ci-config:
    name: opencode-ci-config (OPENCODE_CONFIG)
    runs-on: ubuntu-latest
    steps:
      - uses: $/actions/opencode-ci-config

      - name: Assert bundled config is wired
        run: |
          test -n "${OPENCODE_CONFIG:-}"
          test -f "$OPENCODE_CONFIG"
          jq -e '.permission.external_directory["/tmp"] == "allow"' "$OPENCODE_CONFIG"

  semantic-pull-request:
    name: semantic-pull-request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6

  release-check:
    name: semantic-release dry-run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: $/actions/setup-mise

      - name: Install release tooling
        run: bun install --frozen-lockfile

      - name: semantic-release dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release --dry-run
