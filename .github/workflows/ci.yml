name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  opencode-slash-command:
    name: opencode-slash-command (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencode-slash-command
    steps:
      - uses: actions/checkout@v4

      - uses: ./setup-pnpm
        with:
          pnpm-version: "9.14.0"
          node-version: "24"
          install: "false"
          cache-dependency-path: opencode-slash-command/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      - name: Verify dist exists
        run: test -f dist/index.js

  smoke-setup-pnpm:
    name: setup-pnpm smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./setup-pnpm
        with:
          pnpm-version: "9.14.0"
          node-version: "24"
          install: "false"
          cache: "false"

      - run: pnpm --version
      - run: node --version
