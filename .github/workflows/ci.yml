name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/setup-mise

      - name: Lint workflows
        run: actionlint -color .github/workflows/*.yml

  opencode-resolver:
    name: opencode-resolver (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencode-resolver
    steps:
      - uses: actions/checkout@v4

      - uses: $/setup-mise

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      - name: Verify dist exists
        run: test -f dist/index.js

      - name: Verify action metadata
        run: test -f action.yml

  smoke-setup-mise:
    name: setup-mise smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/setup-mise

      - name: Assert pinned mise version
        run: mise --version | grep -F "2026.10.2"

      - run: node --version
      - run: pnpm --version

  smoke-setup-pnpm:
    name: setup-pnpm smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/setup-pnpm
        with:
          pnpm-version: "9.14.0"
          node-version: "24"
          install: "false"
          cache: "false"

      - run: pnpm --version
      - run: node --version

  smoke-setup-supabase-cli:
    name: setup-supabase-cli (missing secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expect failure when secrets unset
        uses: $/setup-supabase-cli
        continue-on-error: true
        id: supabase

      - name: Assert missing-secret guard
        run: |
          if [ "${{ steps.supabase.outcome }}" != "failure" ]; then
            echo "Expected setup-supabase-cli to fail without secrets"
            exit 1
          fi

  smoke-publish-github-pages-artifact:
    name: publish-github-pages-artifact (skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/publish-github-pages-artifact
        with:
          path: .
          skip: "true"

  smoke-opencode-github-progress:
    name: opencode-github-progress (stage script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/opencode-github-progress

      - name: Assert helper is executable outside checkout
        run: |
          test -x /tmp/opencode-github-progress.sh
          test -n "${OPENCODE_GITHUB_PROGRESS_SCRIPT:-}"
          test -n "${OPENCODE_CONFIG_DIR:-}"
          test -f "${OPENCODE_CONFIG_DIR}/opencode.json"

  release-check:
    name: semantic-release dry-run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: $/setup-mise

      - name: Install release tooling
        run: bun install --frozen-lockfile

      - name: semantic-release dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release --dry-run
