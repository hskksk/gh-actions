name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/actions/setup-mise

      - name: Lint workflows
        run: actionlint -color .github/workflows/*.yml

  opencode-resolver:
    name: opencode-resolver (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actions/opencode-resolver
    steps:
      - uses: actions/checkout@v4

      - uses: $/actions/setup-mise

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      - name: Verify dist exists
        run: test -f dist/index.js

      - name: Verify action metadata
        run: test -f action.yml

  smoke-setup-mise:
    name: setup-mise smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/actions/setup-mise

      - name: Assert pinned mise version
        run: mise --version | grep -F "2026.10.2"

      - run: node --version
      - run: pnpm --version

  smoke-setup-pnpm:
    name: setup-pnpm smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/actions/setup-pnpm
        with:
          pnpm-version: "9.14.0"
          node-version: "24"
          install: "false"
          cache: "false"

      - run: pnpm --version
      - run: node --version

  smoke-setup-supabase-cli:
    name: setup-supabase-cli (missing secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expect failure when secrets unset
        uses: $/actions/setup-supabase-cli
        continue-on-error: true
        id: supabase

      - name: Assert missing-secret guard
        run: |
          if [ "${{ steps.supabase.outcome }}" != "failure" ]; then
            echo "Expected setup-supabase-cli to fail without secrets"
            exit 1
          fi

  smoke-publish-github-pages-artifact:
    name: publish-github-pages-artifact (skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: $/actions/publish-github-pages-artifact
        with:
          path: .
          skip: "true"

  smoke-opencode-ci-config:
    name: opencode-ci-config (OPENCODE_CONFIG)
    runs-on: ubuntu-latest
    steps:
      - uses: $/actions/opencode-ci-config

      - name: Assert bundled config is wired
        run: |
          test -n "${OPENCODE_CONFIG:-}"
          test -f "$OPENCODE_CONFIG"
          jq -e '.permission.external_directory["/tmp"] == "allow"' "$OPENCODE_CONFIG"

  smoke-opencode-github-run:
    name: opencode-github-run (resolve version)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned and authenticated OpenCode version
        env:
          FALLBACK_VERSION: "1.19.5"
        run: |
          set -euo pipefail
          pinned="$(printf '%s' "1.19.5" | sed 's/^v//')"
          test "$pinned" = "1.19.5"
          tag=""
          tag="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/anomalyco/opencode/releases/latest" \
            | jq -r '.tag_name // empty'
          )"
          tag="${tag#v}"
          if [ -z "$tag" ]; then
            tag="$FALLBACK_VERSION"
          fi
          if [[ "$tag" =~ ^2\. ]]; then
            tag="$FALLBACK_VERSION"
          fi
          echo "resolved=${tag}"
          test -n "$tag"

      - name: Assert action metadata exists
        run: test -f actions/opencode-github-run/action.yml

  release-check:
    name: semantic-release dry-run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: $/actions/setup-mise

      - name: Install release tooling
        run: bun install --frozen-lockfile

      - name: semantic-release dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release --dry-run
