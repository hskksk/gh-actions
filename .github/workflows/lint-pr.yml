# Reusable PR lint: Conventional Commits on the PR title and on every commit in the PR.
# Also dogfoods in this repo via the `pull_request` trigger below.
# Other repos: thin wrapper with `workflow_call` — see examples/lint-pr-consumer.yml.
#
# PR title  -> amannn/action-semantic-pull-request
# Every commit in the PR -> wagoid/commitlint-github-action (reads the caller's commitlint config).
name: Lint PR

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  semantic-pull-request:
    name: semantic-pull-request
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
